<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Outdoor Survival Skills</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon"
      type="image/png"
      href="images/favicon.png">
</head>

<body>

<header>

    <div class="header-container">

        <a class="logo" href="index.html">
            Outdoor Survival
        </a>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="explorer.html">Explorer</a></li>
                <li><a href="basics.html">Basics</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>

    </div>

</header>


<main>

    <section class="page-heading">

        <h1>Contact Us</h1>

        <p>
            Have a question or suggestion?
            Use the form below to send feedback.
        </p>

    </section>


    <section class="contact-box">

        <h2>Send a Message</h2>


        <form action="#">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required>


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required>


            <label for="topic">
                Topic
            </label>

            <select id="topic"
                    name="topic">

                <option value="general">
                    General Question
                </option>

                <option value="fire">
                    Fire
                </option>

                <option value="shelter">
                    Shelter
                </option>

                <option value="water">
                    Water
                </option>

                <option value="navigation">
                    Navigation
                </option>

                <option value="feedback">
                    Website Feedback
                </option>

            </select>


            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                rows="6"
                required></textarea>


            <button type="submit">
                Send Message
            </button>

        </form>


        <p class="small-text">
            This form is a demonstration and does not
            submit or save information.
        </p>

    </section>

</main>


<footer>

    <p>&copy; 2026 Murodjon Abduganiev</p>
    <p>Outdoor Survival Skills</p>

</footer>

</body>

</html>
