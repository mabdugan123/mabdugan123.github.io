<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Log In | Outdoor Survival Skills</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="icon"
          type="image/png"
          href="images/favicon.png">

</head>

<body>

<header>

    <div class="header-container">

        <a class="logo" href="index.html">
            Outdoor Survival
        </a>

        <nav aria-label="Main navigation">
            <ul>
                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>
            </ul>
        </nav>

    </div>

</header>


<main>

    <section class="page-heading account-section">

        <h1>Log In</h1>

        <p>
            Log in to access the survival skills explorer.
        </p>

    </section>


    <section class="section">

        <div class="login-box">

            <form action="explorer.html">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required>


                <button type="submit">
                    Log In
                </button>

            </form>


            <p class="signup-text">
                Don't have an account?
            </p>

            <a href="signup.html">
                Create an account
            </a>

            <p class="small-text">
                This is a demonstration login.
            </p>

        </div>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 Murodjon Abduganiev
    </p>

    <p>
        Outdoor Survival Skills
    </p>

</footer>

</body>

</html>
